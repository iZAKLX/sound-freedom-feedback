<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="referrer" content="no-referrer"><title>聲而自由系列演出｜滿意度調查</title><style>
:root{font:16px system-ui,-apple-system,sans-serif;color:#20243b;background:#f2f4fa}*{box-sizing:border-box}body{margin:0}main{max-width:720px;margin:32px auto;padding:0 16px 40px}header,fieldset,.notice,.question{background:white;border:1px solid #dde0ed;border-radius:14px;padding:24px;margin:0 0 18px}header{border-top:7px solid #5746e3}h1{font-size:1.7rem;line-height:1.4}p{line-height:1.8}legend{float:left;width:100%;font-weight:600;line-height:1.6;margin-bottom:20px;padding:0}.ratings{clear:both;display:grid;grid-template-columns:repeat(6,1fr);gap:8px}.rating{position:relative;cursor:pointer;text-align:center}.rating input{position:absolute;opacity:0}.rating span{display:block;padding:15px 0;border:1px solid #aab0c6;border-radius:10px}.rating input:checked+span{color:white;background:#5746e3}.rating input:focus-visible+span{outline:3px solid #27203c;outline-offset:3px}textarea{display:block;width:100%;margin-top:16px;font:inherit;line-height:1.7;padding:12px;border:1px solid #aab0c6;border-radius:8px;resize:vertical}button{background:#5746e3;color:white;font:inherit;font-weight:600;border:0;border-radius:9px;padding:14px 32px;cursor:pointer}button:disabled{opacity:.6}.small{font-size:.875rem;color:#555d75}[hidden]{display:none!important}@media(max-width:480px){header,fieldset,.question,.notice{padding:20px}.ratings{gap:6px}}
</style></head><body><main><header><h1>聲而自由系列演出<br>滿意度調查</h1><p>感謝您蒞臨本場音樂，為了提升演出品質與觀賞體驗，誠摯邀請您填寫滿意度調查表，分享您對節目內容、活動流程、前台服務、視覺效果等方面的感受與建議。</p><p class="small">標示 * 的題目為必填。</p></header><div id="invalid" class="notice" role="alert" hidden>請使用現場提供的專屬 QR Code 開啟問卷。</div><form id="feedback" method="post" action="https://docs.google.com/forms/d/e/1FAIpQLScQLO9piIUClnMg_MShOaQbxDx8jHcoLgH-dCDRaE7SH8cQQA/formResponse" accept-charset="UTF-8" hidden><input id="performance" type="hidden" name="entry.1720371831"><div id="questions"></div><div class="question"><label for="suggestions">其他建議</label><textarea id="suggestions" name="entry.365798660" rows="5"></textarea></div><p class="small">送出後將前往 Google 表單確認頁；請確認頁面顯示已收到回覆。</p><button type="submit">送出回覆</button><p id="status" role="status"></p></form><noscript><p>請啟用 JavaScript 後重新開啟問卷。</p></noscript></main><script>
'use strict';
const shows={moonlight:'月光動物園',destiny:'愛在命定之前',menu:'總譜師的有菜單料理',mirror:'意若思鏡'};
const questions=[[1734481785,'您對本場音樂會的活動流程是否滿意？'],[373212024,'您對本場音樂會的節目內容與曲目安排是否滿意？'],[813035582,'您對前台服務人員的服務態度與現場引導是否滿意？'],[186778427,'您對本場音樂會的燈光效果是否滿意？'],[673531491,'您對本場音樂會的舞台設計、演出效果是否滿意？'],[1889923750,'您對本場音樂會的整體滿意度為何？']];
for(const [id,title] of questions){const field=document.createElement('fieldset');const legend=document.createElement('legend');legend.textContent=title+' *';field.append(legend);const ratings=document.createElement('div');ratings.className='ratings';for(let i=1;i<=6;i++){const label=document.createElement('label');label.className='rating';const input=document.createElement('input');input.type='radio';input.name='entry.'+id;input.value=String(i);input.required=true;const span=document.createElement('span');span.textContent=String(i);label.append(input,span);ratings.append(label);}field.append(ratings);document.getElementById('questions').append(field);}
const code=new URLSearchParams(location.search).get('show');const form=document.getElementById('feedback');if(Object.hasOwn(shows,code)){document.getElementById('performance').value=shows[code];form.hidden=false;}else{document.getElementById('invalid').hidden=false;}
form.addEventListener('submit',()=>{form.querySelector('button').disabled=true;document.getElementById('status').textContent='正在送出，請稍候…';});addEventListener('pageshow',()=>{form.querySelector('button').disabled=false;document.getElementById('status').textContent='';});
</script></body></html>
