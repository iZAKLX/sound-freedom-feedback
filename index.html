</style></head><body><main><header><p class="series">聲而自由系列演出</p><h1 class="hero-title">餘音未散，<br><em>想聽聽你的感受。</em></h1><p class="intro">感謝你來到這場演出。邀請你留下感受與建議，讓每一次相遇，都有更好的聲音。</p><svg class="soundmark" viewBox="0 0 210 72" fill="none" aria-hidden="true"><path d="M0 36h26c9 0 9-24 18-24s9 48 18 48 9-60 18-60 9 72 18 72 9-60 18-60 9 48 18 48 9-24 18-24h48" stroke="#b3dcda" stroke-width="1.5"/><path d="M0 36h210" stroke="#b3dcda" stroke-opacity=".25"/></svg><p class="hero-caption">每一份回饋，都是下一場的起點。</p></header><div id="invalid" class="notice" role="alert" hidden>請使用現場提供的專屬 QR Code 開啟問卷。</div><form id="feedback" method="post" action="https://docs.google.com/forms/d/e/1FAIpQLScQLO9piIUClnMg_MShOaQbxDx8jHcoLgH-dCDRaE7SH8cQQA/formResponse" accept-charset="UTF-8" hidden><input id="performance" type="hidden" name="entry.1720371831"><div class="survey-top"><p class="eyebrow">演出回饋</p><h2>把這場的感受，<br>留給下一次演出。</h2><p class="small">請依你的觀賞感受選擇 1–6 分。標示 * 的題目為必填。</p><div class="progress-row"><span>填答進度</span><strong id="progress-count" aria-live="polite">0 / 6</strong></div><div class="progress-track" role="progressbar" aria-label="已完成的必填題數" aria-valuemin="0" aria-valuemax="6" aria-valuenow="0"><div class="progress-fill"></div></div></div><div id="questions"></div><div class="question"><label for="suggestions">其他建議<span class="optional">選填</span></label><textarea id="suggestions" name="entry.365798660" rows="4" placeholder="有沒有讓你印象深刻的片刻，或希望我們改善的地方？"></textarea></div><div class="submit-area"><button type="submit">送出回饋</button><p class="submit-note">送出後，請確認頁面顯示「我們已經收到您回覆的表單」。</p><p id="status" role="status"></p></div><div class="closing">謝謝你，讓聲音繼續</div></form><noscript><p>請啟用 JavaScript 後重新開啟問卷。</p></noscript></main><script>
'use strict';
const shows={moonlight:'月光動物園',destiny:'愛在命定之前',menu:'總譜師的有菜單料理',mirror:'意若思鏡'};
const questions=[[1734481785,'您對本場音樂會的活動流程是否滿意？'],[373212024,'您對本場音樂會的節目內容與曲目安排是否滿意？'],[813035582,'您對前台服務人員的服務態度與現場引導是否滿意？'],[186778427,'您對本場音樂會的燈光效果是否滿意？'],[673531491,'您對本場音樂會的舞台設計、演出效果是否滿意？'],[1889923750,'您對本場音樂會的整體滿意度為何？']];
for(const [id,title] of questions){const field=document.createElement('fieldset');const legend=document.createElement('legend');legend.textContent=title;const star=document.createElement('span');star.className='required';star.textContent='*';star.setAttribute('aria-label','必填');legend.append(star);field.append(legend);const ratings=document.createElement('div');ratings.className='ratings';for(let i=1;i<=6;i++){const label=document.createElement('label');label.className='rating';const input=document.createElement('input');input.type='radio';input.name='entry.'+id;input.value=String(i);input.required=true;const span=document.createElement('span');span.textContent=String(i);label.append(input,span);ratings.append(label);}field.append(ratings);document.getElementById('questions').append(field);}
const code=new URLSearchParams(location.search).get('show');const form=document.getElementById('feedback');if(Object.hasOwn(shows,code)){document.getElementById('performance').value=shows[code];form.hidden=false;}else{document.getElementById('invalid').hidden=false;}
form.addEventListener('change',()=>{const fields=[...form.querySelectorAll('fieldset')];let completed=0;for(const field of fields){const answered=!!field.querySelector('input:checked');field.classList.toggle('answered',answered);if(answered)completed++;}document.getElementById('progress-count').textContent=completed+' / 6';document.querySelector('.progress-fill').style.width=(completed/6*100)+'%';document.querySelector('[role=progressbar]').setAttribute('aria-valuenow',String(completed));});
form.addEventListener('submit',()=>{form.querySelector('button').disabled=true;document.getElementById('status').textContent='正在送出，請稍候…';});addEventListener('pageshow',()=>{form.querySelector('button').disabled=false;document.getElementById('status').textContent='';});
</script></body></html>
